name: Automated Database Backup (Daily to Cloudflare R2)

on:
  schedule:
    # Runs daily at 00:00 AM UTC+7 (17:00 UTC)
    - cron: '0 17 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup-to-r2:
    name: Backup PostgreSQL to Cloudflare R2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client & Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client gzip

      - name: Create Compressed Database Dump
        env:
          DATABASE_URL: ${{ secrets.RENDER_EXTERNAL_DB_URL || secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ Error: DATABASE_URL or RENDER_EXTERNAL_DB_URL secret is not set!"
            exit 1
          fi

          TIMESTAMP=$(date +"%Y-%m-%d_%H%M%S")
          BACKUP_NAME="leagueflow_backup_${TIMESTAMP}.sql.gz"
          echo "BACKUP_NAME=$BACKUP_NAME" >> $GITHUB_ENV

          echo "🚀 Creating PostgreSQL dump from Render Database..."
          pg_dump "$DATABASE_URL" \
            --no-owner \
            --no-privileges \
            --clean \
            --if-exists \
            --format=plain | gzip -9 > "$BACKUP_NAME"

          FILE_SIZE=$(du -h "$BACKUP_NAME" | cut -f1)
          echo "✅ Backup created successfully: $BACKUP_NAME (Size: $FILE_SIZE)"

      - name: Upload Backup to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'league-flow-local' }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "⚠️ Warning: R2 credentials are missing in GitHub Secrets."
            echo "Skipping upload to Cloudflare R2. Backup is still preserved in GitHub Artifacts below."
            exit 0
          fi

          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="auto"

          echo "📦 Uploading $BACKUP_NAME to Cloudflare R2 (bucket: $R2_BUCKET_NAME)..."
          aws s3 cp "$BACKUP_NAME" "s3://${R2_BUCKET_NAME}/backups/db/${BACKUP_NAME}" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          echo "🎉 Successfully uploaded $BACKUP_NAME to Cloudflare R2!"

      - name: Save Backup to GitHub Actions Artifacts (14 Days Retention)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: ${{ env.BACKUP_NAME }}
          retention-days: 14
