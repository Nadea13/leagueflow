name: CI / CD Quality Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel in-progress runs on the same branch to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Gate 1: Go Backend (Lint, Vet, Test with Race Detector, Build)
  # =========================================================================
  backend-quality-gate:
    name: Backend Quality Gate (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Verify Go Modules
        run: |
          go mod download
          go mod verify

      - name: Run Go Vet (Static Analysis)
        run: go vet ./...

      - name: Run Go Unit Tests
        run: go test -v -race ./...

      - name: Verify Backend Binary Compilation
        run: go build -v ./cmd/server

  # =========================================================================
  # Gate 2: Frontend (ESLint, TypeScript Type-Check, Next.js Build)
  # =========================================================================
  frontend-quality-gate:
    name: Frontend Quality Gate (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Restore Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type-Check
        run: npm run type-check

      - name: Verify Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://leagueflow-v80x.onrender.com/api/v1
