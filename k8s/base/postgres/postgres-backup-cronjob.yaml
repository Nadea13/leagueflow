apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup-to-r2
  namespace: tourni
spec:
  # Run every day at 02:00 AM (UTC)
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump-to-r2
              image: amazon/aws-cli:latest
              env:
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_DB
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_PASSWORD
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: r2-backup-secret
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: r2-backup-secret
                      key: AWS_SECRET_ACCESS_KEY
                - name: AWS_DEFAULT_REGION
                  valueFrom:
                    secretKeyRef:
                      name: r2-backup-secret
                      key: AWS_DEFAULT_REGION
                - name: AWS_ENDPOINT_URL
                  valueFrom:
                    secretKeyRef:
                      name: r2-backup-secret
                      key: AWS_ENDPOINT_URL
                - name: R2_BUCKET_NAME
                  valueFrom:
                    secretKeyRef:
                      name: r2-backup-secret
                      key: R2_BUCKET_NAME
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "Installing postgresql-client..."
                  yum install -y postgresql gzip

                  TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
                  BACKUP_FILE="backup_${POSTGRES_DB}_${TIMESTAMP}.sql.gz"

                  echo "Starting pg_dump for database ${POSTGRES_DB}..."
                  PGPASSWORD="${POSTGRES_PASSWORD}" pg_dump -h postgres-service.tourni.svc.cluster.local -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" | gzip > "/tmp/${BACKUP_FILE}"

                  echo "Uploading ${BACKUP_FILE} to Cloudflare R2 bucket: ${R2_BUCKET_NAME}..."
                  aws s3 cp "/tmp/${BACKUP_FILE}" "s3://${R2_BUCKET_NAME}/database-backups/${BACKUP_FILE}" --endpoint-url "${AWS_ENDPOINT_URL}"

                  echo "Backup completed and successfully synced to Cloudflare R2!"
                  rm -f "/tmp/${BACKUP_FILE}"
