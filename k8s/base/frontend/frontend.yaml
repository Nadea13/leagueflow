apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: leagueflow
data:
  NODE_ENV: "production"
  PORT: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: leagueflow
  labels:
    app: leagueflow-frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: leagueflow-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: leagueflow
  labels:
    app: leagueflow-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: leagueflow-frontend
  template:
    metadata:
      labels:
        app: leagueflow-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/yourusername/leagueflow-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: frontend-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
