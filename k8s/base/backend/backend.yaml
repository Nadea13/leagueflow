apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: leagueflow
data:
  PORT: "8080"
  DATABASE_URL: "postgres://postgres:leagueflow_secure_password_change_me@postgres-service.leagueflow.svc.cluster.local:5432/leagueflow?sslmode=disable"
  REDIS_URL: "redis-service.leagueflow.svc.cluster.local:6379"
  CORS_ORIGINS: "*"
  SMTP_HOST: "mailpit"
  SMTP_PORT: "1025"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: leagueflow
type: Opaque
stringData:
  JWT_SECRET: "super-secret-leagueflow-jwt-key-change-in-production-123456"
  JWT_REFRESH_SECRET: "super-secret-leagueflow-refresh-key-change-in-production-654321"
  STRIPE_SECRET_KEY: "sk_test_..."
  STRIPE_WEBHOOK_SECRET: "whsec_..."
  RESEND_API_KEY: "re_..."
  RESEND_FROM_EMAIL: "LeagueFlow <onboarding@resend.dev>"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: leagueflow
  labels:
    app: leagueflow-backend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: leagueflow-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: leagueflow
  labels:
    app: leagueflow-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: leagueflow-backend
  template:
    metadata:
      labels:
        app: leagueflow-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/yourusername/leagueflow-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
