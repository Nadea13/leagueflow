apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-firewall
  namespace: tourni
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    # 1. Allow connection only from Go Backend pods
    - from:
        - podSelector:
            matchLabels:
              app: tourni-backend
      ports:
        - protocol: TCP
          port: 5432
    # 2. Allow connection from Backup CronJob pod
    - from:
        - podSelector:
            matchLabels:
              job-name: postgres-backup-to-r2
      ports:
        - protocol: TCP
          port: 5432
